# Site-wide settings. One entry, keyed `main`.
# `url` is the one place the site address lives: astro.config.mjs reads it.
main:
  url: https://siddigz.com
  name:
    first: Siddig
    last: Ahmed
    # A recording of each word, in src/assets/audio/. These are placeholder
    # tones until the real ones are brought in with scripts/import-audio.mjs.
    audio:
      first: name-first.wav
      last: name-last.wav
      # Read to screen reader users on each word of the name.
      hint: Plays a recording of this name.
  # Draft. One sentence, at most 22 words.
  pitch: I build software people actually use, from award-winning hackathon projects to student tools, plus two software engineering internships at Ciena.
  # Set `enabled` to false to hide the line. Keep the text free of terms and years.
  lookingFor:
    enabled: true
    text: Open to software engineering internships
  program: Computer Science (Honours), Minor in Mathematics
  school: Carleton University
  gpa: 3.96/4.00
  expectedGraduation: April 2028
  # Shown at the top of the home page. Remove these lines to show a generic figure instead.
  photo:
    src: ../assets/about/portrait.jpg
    alt: Siddig Ahmed, smiling, in glasses and a blue-grey polo shirt.
  links:
    github: https://github.com/Siddigz
    linkedin: https://linkedin.com/in/siddigz
  # This site's own repository. Its commits count towards the recent activity.
  repository: https://github.com/Siddigz/website
  contactNote: The quickest way to reach me is a message on LinkedIn.
  # Used by the per-visitor greeting (stage 3).
  home:
    city: Ottawa
    timeZone: America/Toronto
